<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF004D"/>
      <stop offset="100%" style="stop-color:#CC003D"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0D0D0D"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#brandGradient)" stroke-width="3"/>

  <!-- Stylized M for Mezo - formed by server rack shapes -->
  <g transform="translate(100, 100)">
    <!-- Left pillar of M -->
    <rect x="-50" y="-35" width="18" height="70" rx="3" fill="url(#brandGradient)"/>

    <!-- Right pillar of M -->
    <rect x="32" y="-35" width="18" height="70" rx="3" fill="url(#brandGradient)"/>

    <!-- Middle V of M (two angled bars meeting) -->
    <polygon points="-32,-35 -20,-35 0,15 20,-35 32,-35 5,35 -5,35" fill="url(#brandGradient)"/>

    <!-- Server indicator lines (left) -->
    <rect x="-46" y="-25" width="10" height="3" rx="1" fill="#0D0D0D"/>
    <rect x="-46" y="-15" width="10" height="3" rx="1" fill="#0D0D0D"/>
    <rect x="-46" y="-5" width="10" height="3" rx="1" fill="#0D0D0D"/>

    <!-- Server indicator lines (right) -->
    <rect x="36" y="-25" width="10" height="3" rx="1" fill="#0D0D0D"/>
    <rect x="36" y="-15" width="10" height="3" rx="1" fill="#0D0D0D"/>
    <rect x="36" y="-5" width="10" height="3" rx="1" fill="#0D0D0D"/>

    <!-- Yield/connection dots -->
    <circle cx="-41" cy="25" r="4" fill="#10B981"/>
    <circle cx="41" cy="25" r="4" fill="#10B981"/>
  </g>
</svg>
