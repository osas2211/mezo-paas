<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF004D"/>
      <stop offset="100%" style="stop-color:#CC003D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0D0D0D"/>

  <!-- Simplified M/Server icon -->
  <g transform="translate(16, 16)">
    <rect x="-10" y="-9" width="20" height="5" rx="1" fill="url(#favGrad)"/>
    <rect x="-10" y="-2" width="20" height="5" rx="1" fill="url(#favGrad)"/>
    <rect x="-10" y="5" width="20" height="5" rx="1" fill="url(#favGrad)"/>

    <!-- Status dot -->
    <circle cx="7" cy="-6.5" r="1.5" fill="#10B981"/>
    <circle cx="7" cy="0.5" r="1.5" fill="#10B981"/>
    <circle cx="7" cy="7.5" r="1.5" fill="#10B981"/>
  </g>
</svg>
