<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brandPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF004D"/>
      <stop offset="100%" style="stop-color:#CC003D"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#0A0A0A"/>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FF004D" stroke-width="1" opacity="0.3"/>

  <!-- Main hexagon shape (representing blockchain) -->
  <polygon points="100,25 160,62.5 160,137.5 100,175 40,137.5 40,62.5" fill="none" stroke="url(#brandPink)" stroke-width="3"/>

  <!-- Inner server stack representation -->
  <g transform="translate(100, 100)">
    <!-- Top server bar -->
    <rect x="-35" y="-40" width="70" height="18" rx="4" fill="url(#brandPink)"/>
    <circle cx="25" cy="-31" r="4" fill="#0A0A0A"/>
    <circle cx="25" cy="-31" r="2" fill="#10B981"/>

    <!-- Middle server bar -->
    <rect x="-35" y="-12" width="70" height="18" rx="4" fill="url(#brandPink)"/>
    <circle cx="25" cy="-3" r="4" fill="#0A0A0A"/>
    <circle cx="25" cy="-3" r="2" fill="#10B981"/>

    <!-- Bottom server bar -->
    <rect x="-35" y="16" width="70" height="18" rx="4" fill="url(#brandPink)"/>
    <circle cx="25" cy="25" r="4" fill="#0A0A0A"/>
    <circle cx="25" cy="25" r="2" fill="#10B981"/>

    <!-- Connection lines between servers -->
    <line x1="-25" y1="-22" x2="-25" y2="-12" stroke="#FF004D" stroke-width="2" opacity="0.5"/>
    <line x1="-25" y1="6" x2="-25" y2="16" stroke="#FF004D" stroke-width="2" opacity="0.5"/>

    <!-- Yield arrow (up) -->
    <path d="M -45 10 L -45 -10 L -52 -10 L -40 -25 L -28 -10 L -35 -10 L -35 10 Z" fill="url(#greenGlow)" opacity="0.8"/>
  </g>

  <!-- Corner accents -->
  <circle cx="40" cy="40" r="5" fill="#FF004D" opacity="0.5"/>
  <circle cx="160" cy="40" r="5" fill="#FF004D" opacity="0.5"/>
  <circle cx="40" cy="160" r="5" fill="#FF004D" opacity="0.5"/>
  <circle cx="160" cy="160" r="5" fill="#FF004D" opacity="0.5"/>
</svg>
