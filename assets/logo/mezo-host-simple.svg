<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="simpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF004D"/>
      <stop offset="100%" style="stop-color:#CC003D"/>
    </linearGradient>
  </defs>

  <!-- Clean rounded square background -->
  <rect width="120" height="120" rx="24" fill="#111111"/>

  <!-- Abstract M made of connected nodes (blockchain + hosting) -->
  <g transform="translate(60, 60)">
    <!-- Left vertical bar -->
    <rect x="-38" y="-30" width="12" height="60" rx="6" fill="url(#simpleGrad)"/>

    <!-- Right vertical bar -->
    <rect x="26" y="-30" width="12" height="60" rx="6" fill="url(#simpleGrad)"/>

    <!-- Center diamond/connector (forms M shape) -->
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="url(#simpleGrad)" transform="rotate(45)"/>

    <!-- Top connectors -->
    <rect x="-26" y="-28" width="20" height="8" rx="4" fill="url(#simpleGrad)" transform="rotate(-30 -16 -24)"/>
    <rect x="6" y="-28" width="20" height="8" rx="4" fill="url(#simpleGrad)" transform="rotate(30 16 -24)"/>

    <!-- Active status indicator -->
    <circle cx="0" cy="35" r="6" fill="#10B981"/>
  </g>
</svg>
